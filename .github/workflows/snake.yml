name: Refresh contribution snake

on:
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake

jobs:
  animate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark
      - name: Publish updated animation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/snake.svg assets/snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh contribution snake'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
